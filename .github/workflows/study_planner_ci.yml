name: Study planner - dev_planer validation

# GitHub requires the dispatch entry point on the default branch.
# Select 'dev_planer' in the Run workflow branch selector for actual tests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select-test-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Explain test branch selection
        run: |
          echo "::error::Select the 'dev_planer' branch to run this workflow's test suite."
          exit 1
