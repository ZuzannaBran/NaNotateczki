name: NaNotateczki - cross-platform verification

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *' # Runs only after this workflow is on default branch

permissions:
  contents: read

concurrency:
  group: cross-platform-v3-${{ github.workflow }}-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:ios-override]') && 'failed-only' || 'full' }}
  cancel-in-progress: true

# [ci:android-only] runs only the Android emulator job after a CI-specific fix.
# [ci:failed-only] retains the existing reduced verification mode.
# Add [ci:v2-e2e] to include only the real Linux v2 stack alongside it.
# [ci:failed-only] [ci:ios-override] checks Dart plus iPad only, and cancels
# the previous full matrix on the same dev ref.
jobs:
  analyze-and-unit:
    if: ${{ !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Dart analysis, regressions and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install native PDF import test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Verify generated Drift mappings after schema migration
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/drift/notes_database.g.dart
      - name: Inspect formatting and show the exact patch
        shell: bash
        run: |
          dart format lib test integration_test test_driver
          git diff --exit-code -- lib test integration_test test_driver
      - name: Analyze source and tests
        run: dart analyze
      - name: Verify DDS startup retry handles only infrastructure failures
        run: bash .github/scripts/test_flutter_integration_retry.sh
      - name: Verify sqlite3 hash retry never masks test failures
        run: bash .github/scripts/test_flutter_sqlite3_download_retry.sh
      - name: Verify single-app native iOS test matrix
        run: bash .github/scripts/test_ios_integration_matrix.sh
      - name: Execute non-render native test suite
        shell: bash
        run: |
          mapfile -d '' -t test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/production/export_render_test.dart' \
              -print0 | sort -z
          )
          test "${#test_files[@]}" -gt 0
          flutter test "${test_files[@]}" --coverage --reporter expanded --timeout 3m --concurrency 3
      - name: Enforce initial line coverage floor
        shell: bash
        env:
          MIN_LINE_COVERAGE: '35'
        run: |
          test -s coverage/lcov.info
          awk -F: -v minimum="$MIN_LINE_COVERAGE" '
            /^LF:/ { lines += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (lines == 0) {
                print "No instrumented lines in lcov.info"
                exit 1
              }
              percentage = covered * 100 / lines
              printf "Line coverage: %.2f%% (%d/%d); minimum: %.0f%%\n", percentage, covered, lines, minimum
              if (percentage < minimum) exit 1
            }
          ' coverage/lcov.info
      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  backend-unit:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Python API and deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r server/api/requirements.txt
      - name: Verify backend contract, migrations and security
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          APP_ORIGIN: https://app.example.test
          JWT_SECRET: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdef
        run: |
          cd server
          python -m pytest -q api/tests

  postgres-http-e2e:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: PostgreSQL HTTP smoke (account, sync, sharing, backup)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - name: Prepare isolated database and backup storage
        shell: bash
        run: |
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "BASE_DOMAIN=example.invalid"
          } > .env
          mkdir -p data/backups
          sudo chown -R 1000:1000 data
      - name: Start PostgreSQL and apply all migrations
        run: |
          docker compose up -d --wait db
          bash scripts/apply-migrations.sh
      - name: Start real HTTP API
        run: docker compose -f compose.yaml -f compose.local.yaml up -d --build api
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/ready; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Exercise account, sync, study share and verified backup
        run: python3 scripts/smoke-local-api.py
      - name: Collect backend diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.local.yaml logs --tail=100 api db
      - name: Destroy isolated PostgreSQL volume
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down -v

  v2-controller-e2e:
    if: ${{ contains(github.event.head_commit.message, '[ci:v2-e2e]') || (!contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]')) }}
    name: Linux editor controllers and real v2 backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsqlite3-dev libsecret-1-dev xvfb xauth poppler-utils zenity
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Verify backend mirror tooling and isolated runner guards
        run: |
          python -m unittest discover -s tool -p 'test_check_server_mirror.py'
          python -m unittest discover -s server/scripts/tests -p 'test_stage12_runner_guard.py'
      - name: Run production controllers against disposable PostgreSQL
        working-directory: server
        env:
          NN_STAGE12_FLUTTER_ROOT: ${{ github.workspace }}
          NN_STAGE12_DEVICE_ID: linux
          # The disposable JWT must outlive the initial native compilation.
          access_token_minutes: '45'
        run: xvfb-run -a bash scripts/run-stage12-real.sh --quick

  stylus-input:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Stylus and palm input regression (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format only pen and palm input files
        shell: bash
        run: |
          dart format \
            lib/features/editor/presentation/widgets/drawing_canvas.dart \
            lib/features/editor/presentation/editor_screen.dart \
            lib/features/board/presentation/board_screen.dart \
            test/support/pointer_contact_matrix.dart
          git diff --exit-code -- \
            lib/features/editor/presentation/widgets/drawing_canvas.dart \
            lib/features/editor/presentation/editor_screen.dart \
            lib/features/board/presentation/board_screen.dart \
            test/support/pointer_contact_matrix.dart
      - name: Exercise two-finger navigation, stylus priority and cancellation
        run: >-
          flutter test test/pointer_contact_matrix_test.dart
          test/android_finger_ink_test.dart
          test/cross_platform/pointer_dispatch_contract_test.dart
          --reporter expanded --timeout 90s

  adaptive-layout:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Phone, tablet and desktop layout regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate changing viewport, insets, editor and planner
        run: |
          flutter test \
            test/adaptive_platform_layout_test.dart \
            test/library_screen_responsive_layout_test.dart \
            test/editor_screen_responsive_layout_test.dart \
            test/library_catalog_test.dart \
            test/study_planner_widget_test.dart \
            --reporter expanded --timeout 3m --concurrency 2

  export-render:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: PNG/PDF production renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify real PNG and PDF rendering
        run: flutter test test/production/export_render_test.dart --reporter expanded --timeout 2m

  web:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Chrome, JavaScript/IndexedDB and web bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: flutter config --enable-web
      - run: flutter pub get
      - name: Browser-compatible regressions
        run: >-
          bash .github/scripts/flutter_sqlite3_download_retry.sh
          --platform chrome test/cross_platform --reporter expanded
      - name: Compile complete web application
        run: flutter build web --release --no-web-resources-cdn
      - name: Validate runtime assets and package the Cloudflare upload
        run: |
          python3 -B -m unittest discover -s test -p 'cloudflare_web_package_test.py' -v
          python3 tool/package_cloudflare_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify built app and PDF rendering without external CDNs
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: node .github/scripts/test_web_local_assets.mjs
      - name: Verify Cloudflare Workers deployment and local runtime
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
          WRANGLER_SEND_METRICS: 'false'
        run: node .github/scripts/test_cloudflare_worker.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: nanotateczki-cloudflare-upload
          path: build/nanotateczki-cloudflare-*.zip
          if-no-files-found: error
      - name: Browser end-to-end bootstrap
        shell: bash
        run: |
          command -v chromedriver
          chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          flutter drive -d web-server --browser-name chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_smoke_test.dart \
            --chrome-binary="${{ steps.chrome.outputs.chrome-path }}"
          flutter drive -d web-server --browser-name chrome \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/document_lifecycle_test.dart \
            --dart-define=NANOTATECZKI_ISOLATED_CI=true \
            --chrome-binary="${{ steps.chrome.outputs.chrome-path }}"

  wasm-audit:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: WebAssembly compatibility audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Attempt WebAssembly release build
        id: wasm
        continue-on-error: true
        run: flutter build web --wasm --release
      - name: Report WebAssembly compatibility separately from JS web
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.wasm.outcome }}" = "success" ]; then
            echo "WASM compilation succeeded; browser runtime is not verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::WASM compilation is not supported yet. See the build log for dependency import chains."
            echo "WASM compilation failed; JS web validation remains independent." >> "$GITHUB_STEP_SUMMARY"
          fi

  desktop:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: ${{ matrix.platform }} - desktop bootstrap and release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux native prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsqlite3-dev libsecret-1-dev \
            xvfb poppler-utils zenity
      - uses: subosito/flutter-action@v2
        id: flutter-setup
        continue-on-error: ${{ matrix.platform == 'macos' }}
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Retry macOS Flutter SDK download if interrupted
        if: matrix.platform == 'macos' && steps.flutter-setup.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter config --enable-${{ matrix.platform }}-desktop
      - run: flutter pub get
      - name: Verify Linux startup environment
        if: matrix.platform == 'linux'
        run: bash .github/scripts/test_linux_environment.sh
      - name: Verify merged UI and planner lifecycle on native desktop
        run: >-
          flutter test test/merged_ui_integration_test.dart
          test/pointer_contact_matrix_test.dart
          test/study_planner_button_contrast_test.dart
          test/study_planner_controller_test.dart
          --reporter expanded --timeout 90s
      - name: Run actual Linux application with a virtual display
        if: matrix.platform == 'linux'
        run: xvfb-run -a flutter test integration_test/app_smoke_test.dart -d linux
      - name: Run actual Windows application
        if: matrix.platform == 'windows'
        run: flutter test integration_test/app_smoke_test.dart -d windows
      - name: Run actual macOS application
        if: matrix.platform == 'macos'
        run: flutter test integration_test/app_smoke_test.dart -d macos
      - name: Isolated Linux document lifecycle
        if: matrix.platform == 'linux'
        run: |
          xvfb-run -a flutter test integration_test/document_lifecycle_test.dart \
            -d linux --dart-define=NANOTATECZKI_ISOLATED_CI=true
      - name: Isolated Windows document lifecycle
        if: matrix.platform == 'windows'
        run: flutter test integration_test/document_lifecycle_test.dart -d windows --dart-define=NANOTATECZKI_ISOLATED_CI=true
      - name: Isolated macOS document lifecycle
        if: matrix.platform == 'macos'
        run: |
          flutter test integration_test/document_lifecycle_test.dart \
            -d macos --dart-define=NANOTATECZKI_ISOLATED_CI=true
      - name: Verify synthetic pen and palm contacts on Linux desktop
        if: matrix.platform == 'linux'
        run: xvfb-run -a flutter test integration_test/pointer_contact_matrix_test.dart -d linux
      - name: Verify synthetic pen and palm contacts on Windows desktop
        if: matrix.platform == 'windows'
        run: flutter test integration_test/pointer_contact_matrix_test.dart -d windows
      - name: Verify synthetic pen and palm contacts on macOS desktop
        if: matrix.platform == 'macos'
        run: flutter test integration_test/pointer_contact_matrix_test.dart -d macos
      - name: Build release application
        if: ${{ !cancelled() }}
        run: flutter build ${{ matrix.platform }} --release

  android-build:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: Android APK compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Free space for Gradle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Compile Android Release APK (distribution signing not verified)
        if: ${{ !cancelled() }}
        run: flutter build apk --release

  ios-build:
    if: ${{ !contains(github.event.head_commit.message, '[ci:failed-only]') && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    name: iOS simulator compilation (no signing)
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-setup
        continue-on-error: true
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Retry macOS Flutter SDK download if interrupted
        if: steps.flutter-setup.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Use CocoaPods for all iOS plugins
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Install pods and validate Xcode workspace
        shell: bash
        run: |
          cd ios
          pod install
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          grep -q "Pods.xcodeproj" Runner.xcworkspace/contents.xcworkspacedata
      - run: flutter build ios --simulator --no-codesign
      - name: Compile unsigned iOS device Release
        if: ${{ !cancelled() }}
        run: flutter build ios --release --no-codesign

  android-emulator:
    name: Android - real emulator end-to-end
    if: ${{ github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[ci:failed-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Verify emulator disk preflight decisions
        run: bash .github/scripts/test_android_emulator_preflight.sh
      - name: Free space for Android emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Precompile Android debug APK before starting emulator
        run: flutter build apk --debug
      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disk-size: 1536M
          emulator-boot-timeout: 300
          pre-emulator-launch-script: bash .github/scripts/android_emulator_preflight.sh
          script: bash .github/scripts/android_emulator_tests.sh

  ios-simulator:
    name: iOS - ${{ matrix.device }} simulator end-to-end
    if: ${{ github.event_name != 'pull_request' && (!contains(github.event.head_commit.message, '[ci:failed-only]') || contains(github.event.head_commit.message, '[ci:ios-override]')) && !contains(github.event.head_commit.message, '[ci:android-only]') }}
    runs-on: macos-15
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(contains(github.event.head_commit.message, '[ci:ios-override]') && '["iPad"]' || '["iPhone","iPad"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        id: flutter-setup
        continue-on-error: true
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Retry macOS Flutter SDK download if interrupted
        if: steps.flutter-setup.outcome == 'failure'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Use CocoaPods for all iOS plugins
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Install pods and validate Xcode workspace
        shell: bash
        run: |
          cd ios
          pod install
          test -f "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          grep -q "Pods.xcodeproj" Runner.xcworkspace/contents.xcworkspacedata
      - name: Boot an available simulator for the selected device
        shell: bash
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); device="${{ matrix.device }}"; print(next((v["udid"] for devices in d["devices"].values() for v in devices if device in v["name"] and v["state"] == "Shutdown"), ""))')
          test -n "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
      - name: Run all iOS integration cases in a single app process
        timeout-minutes: 30
        run: bash .github/scripts/ios_integration_matrix.sh "$SIMULATOR_UDID"
