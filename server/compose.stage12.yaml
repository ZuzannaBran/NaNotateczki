name: nanotateczki-stage12

# Disposable, localhost-only PostgreSQL. Never mount production volumes.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nanotateczki_stage12_test
      POSTGRES_USER: stage12_admin
      POSTGRES_PASSWORD: stage12-disposable-only
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stage12_admin -d nanotateczki_stage12_test"]
      interval: 2s
      timeout: 2s
      retries: 30
